        - __flox_venue_availability_consume_wrong_side_recovery_bps
        - __flox_venue_availability_create
        - __flox_venue_availability_destroy
        - __flox_venue_availability_is_up
        - __flox_venue_availability_latency_multiplier
        - __flox_venue_availability_schedule_outage
