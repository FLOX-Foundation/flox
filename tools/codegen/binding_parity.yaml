## Cross-binding parity manifest.
##
## Declares, per IDL group (`FLOX_EXPORT(group = "X")` in
## include/flox/capi/flox_capi_spec.hpp), which language bindings are
## expected to expose what. Verified by `scripts/check_binding_parity.py`
## (run in CI as part of the verify-docs-current job).
##
## Each group has up to four binding entries: pybind11, napi, codon, quickjs.
## Allowed status values:
##   required          binding must expose the listed `classes` / `functions`
##   not_applicable    group is internal helpers / never user-facing here
##   allowlist         known gap; must include a `reason` (link a tracker task)
##
## When a new IDL group is added, add a top-level entry here or CI fails.
##
## Codon coverage is asserted via the auto-generated golden file — every
## group that emits exports ends up there, so codon defaults to `required`
## with no class/function listing.
##
## QuickJS `functions:` are checked against the addGlobalFunc registration
## table in src/quickjs/js_bindings.cpp, so a `quickjs: required` entry lists
## the global names a strategy calls (`__flox_*`), not the C-API names. They
## are written out because they are not derivable: the `__` + C-API-name
## convention has real exceptions, e.g. __flox_vprofile_create wraps
## flox_volume_profile_create.
## QuickJS `classes:` are checked against the embedded JS standard library in
## src/quickjs/js_strategy.cpp (the same extractor scripts/sync_mcp_data.py
## uses for the MCP binding manifest), so list the class name a strategy sees
## (e.g. CompositeBook), not a C++ or registration-table name.
##
## Most groups still carry no `quickjs` entry. The gate counts and names those
## instead of passing them silently; run it with --require-quickjs to make an
## undeclared group a failure once this file is complete.

