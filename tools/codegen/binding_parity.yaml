        - __flox_bar_dispatch_recorder_count
        - __flox_bar_dispatch_recorder_create
        - __flox_bar_dispatch_recorder_destroy
        - __flox_bar_dispatch_recorder_finalize
        - __flox_bar_dispatch_recorder_on_trade
        - __flox_bar_dispatch_recorder_param_at
        - __flox_bar_dispatch_recorder_type_at

