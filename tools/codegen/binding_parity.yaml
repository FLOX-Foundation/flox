    napi: { status: required, classes: [OrderBook] }
    codon: { status: required }

  l3_order:
    pybind11: { status: required, classes: [L3Book] }
    napi: { status: required, classes: [L3Book] }
    codon: { status: required }

  composite_book:
    pybind11: { status: required, classes: [CompositeBookMatrix] }
    napi: { status: required, classes: [CompositeBookMatrix] }
    codon: { status: required }
    quickjs:
      status: required
      # Also doubles as the live regression check for QuickJS class parity
      # itself: this entry used to be unverifiable (see check_binding_parity.py).
      classes: [CompositeBook]
      functions:
        - __flox_cb_create
        - __flox_cb_destroy
        - __flox_cb_apply_snapshot
        - __flox_cb_apply_delta
        - __flox_cb_best_bid
        - __flox_cb_best_ask
        - __flox_cb_has_arb
        - __flox_cb_mark_stale
