name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No observed duration on a PR (main-push only); mkdocs builds are fast.
    timeout-minutes: 10
    # gh-deploy pushes the built site to the gh-pages branch with this
    # job's token, so it needs write on contents beyond the read default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
