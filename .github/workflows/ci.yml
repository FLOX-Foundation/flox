  connectors-build:
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Observed: ~11 min.
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 \
                                libssl-dev zlib1g-dev libcurl4-openssl-dev

    - name: Install GoogleTest
      # connectors/tests/CMakeLists.txt requires it (find_package(GTest
      # REQUIRED)) once FLOX_BUILD_TESTS pulls that directory in below.
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_INSTALL_PREFIX=$HOME/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    # Network deps (ixwebsocket, simdjson) come in via FetchContent
    # at configure time. Polymarket Rust FFI is opt-OUT here so the
    # job doesn't need a Rust toolchain. FLOX_BUILD_TESTS is required
    # alongside FLOX_BUILD_CONNECTORS: connectors/CMakeLists.txt only
    # adds its own tests/ subdirectory when that flag is on, so without
    # it the unit_test_* targets never exist for ctest to run -- no
    # workflow set both flags together before this.
    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=$HOME/gtest-install \
              -DFLOX_BUILD_CONNECTORS=ON \
              -DFLOX_ENABLE_POLYMARKET_ORDER_EXECUTOR=OFF \
              -DFLOX_BUILD_TESTS=ON

    - name: Build connectors target and tests
      run: cmake --build build -j$(nproc)

    - name: Verify static archive exists
      run: test -f build/connectors/libflox-connectors.a

    - name: Run connector unit tests
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

  # The venue module must stay genuinely optional: a build with it OFF has to
  # configure, compile and pass its suite with no venue code involved. Cheap
  # job, but it is the only thing that stops the OFF path from rotting.
  # Static proof that every handler reaching the matcher applies its pre-trade
  # gates first. Property tests can only assert this for the paths someone
  # enumerated; this asserts it over the code, so a new path cannot skip a
  # check silently. Configure only -- the check reads compile_commands.json and
  # never needs a compiled object.
  venue-gate-reachability:
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Observed: ~30s (configure only, no build).
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-18 libgtest-dev libgmock-dev
        pip install libclang

    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=clang++-18 \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLOX_BUILD_VENUE=ON \
              -DFLOX_BUILD_TESTS=ON

    - name: Prove every path into matching applies its gates
      run: python3 scripts/check_gate_reachability.py

    - name: Exhaustively check the checkpoint/recovery protocol
      run: python3 scripts/check_recovery_model.py

  venue-optional:
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Observed: ~4 min.
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev

    - name: Configure without the venue
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLOX_BUILD_VENUE=OFF \
              -DFLOX_BUILD_TESTS=ON \
              -DFLOX_BUILD_DEMO=ON \
              -DFLOX_ENABLE_BACKTEST=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Verify nothing venue-side was built
      run: |
        test ! -f build/venue/libflox-venue.a
        ! ctest --test-dir build -N | grep -qE "Test +#[0-9]+: test_venue_(matcher|engine|ledger)"

  # The venue's engine without its network perimeter: the configuration a
  # platform without POSIX sockets gets. Kept honest by checking that the
  # engine's own tests DO run here -- an exclusion rule that quietly took
  # the matcher with the gateways would otherwise look like a pass.
  venue-engine-only:
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Observed: ~5 min.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev
    # Seconds, and it answers for every header at once. The Windows job
    # answers the same question eight minutes in and one header at a time,
    # because the compiler stops at the first.
    - name: Check the engine reaches no POSIX header unconditionally
      run: python3 scripts/check_engine_portability.py
    - name: Configure with the engine and without the perimeter
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLOX_BUILD_VENUE=ON \
              -DFLOX_VENUE_PERIMETER=OFF \
              -DFLOX_BUILD_TESTS=ON \
              -DFLOX_ENABLE_BACKTEST=ON
    - name: Build
      run: cmake --build build -j"$(nproc)"
    - name: Test
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build
    - name: Verify the engine is here and the perimeter is not
      run: |
        test -f build/venue/libflox-venue.a
        for t in matcher engine ledger checkpoint recovery conservation_fuzz differential_fuzz; do
          ctest --test-dir build -N | grep -qE "test_venue_$t\b" \
            || { echo "::error::engine test test_venue_$t is missing from the engine-only build"; exit 1; }
        done
        for t in gateway fix_session md_distribution control_plane tls; do
          ! ctest --test-dir build -N | grep -qE "test_venue_$t\b" \
            || { echo "::error::perimeter test test_venue_$t was built without the perimeter"; exit 1; }
        done

  # Weekly deep run of the venue fuzzes. Pull requests run them at a
  # CI-friendly depth; this raises the command count by an order of magnitude,
  # which is where the rarer book divergences and reservation leaks surface.
  venue-deep-fuzz:
    if: github.event_name == 'schedule'
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Weekly-only; 2,000,000 fuzz ops is deliberately an order of magnitude
    # past the PR-time depth, so give it real headroom.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libgtest-dev libgmock-dev

    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLOX_BUILD_TESTS=ON \
              -DFLOX_ENABLE_BACKTEST=ON

    - name: Build the fuzz targets
      run: cmake --build build --target test_venue_differential_fuzz test_venue_conservation_fuzz -j$(nproc)

    - name: Differential fuzz (deep)
      env:
        FLOX_FUZZ_OPS: 2000000
      run: ./build/venue/test_venue_differential_fuzz

    - name: Conservation fuzz
      run: ./build/venue/test_venue_conservation_fuzz
