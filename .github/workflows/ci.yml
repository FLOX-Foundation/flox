    - name: Run tests
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Run demo
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/flox_demo

    - name: Run benchmarks
      run: ./scripts/run-benchmarks.sh build/benchmarks

  sanitizers:
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Observed: ~11-15 min per sanitizer.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build liblz4-dev g++-14

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Configure with sanitizer
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
              -DFLOX_BUILD_TESTS=ON \
              -DFLOX_BUILD_BENCHMARKS=OFF \
              -DFLOX_BUILD_DEMO=ON \
              -DFLOX_ENABLE_LZ4=ON \
              -DFLOX_ENABLE_BACKTEST=ON \
              -DFLOX_BUILD_CAPI=ON \
              -DFLOX_BUILD_QUICKJS=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests with sanitizer
      # ThreadSanitizer had no options of its own here and ran on its
      # defaults. They are spelled out now: keep going after a race so one
      # run reports every race rather than the first, and keep the nonzero
      # exit as a second line of defence behind the transcript scan.
      #
      # UBSAN_OPTIONS carries abort_on_error=1 now, matching ASAN_OPTIONS.
      # Without it, halt_on_error=1 on Linux calls a plain _exit(), which
      # skips every signal handler -- including the one Python's own
      # faulthandler installs to print a diagnosable crash report. The
      # process would just vanish with exit code 1 and nothing in the
      # transcript to scan. abort_on_error=1 raises SIGABRT instead, so a
      # halt is diagnosable the same way a memory-safety abort already is.
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
        TSAN_OPTIONS: halt_on_error=0:exitcode=66:second_deadlock_stack=1
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Run demo with sanitizer
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
        TSAN_OPTIONS: halt_on_error=0:exitcode=66:second_deadlock_stack=1
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/flox_demo

  macos:
    needs: [format-check, verify-docs-current]
    runs-on: macos-latest
    # Observed: ~7-8 min plain, +119% with the undefined-behavior sanitizer
    # (~15 min) -- still at or below linux-gcc, the longest job in the
    # matrix, so this does not lengthen the overall run. LeakSanitizer and
    # ThreadSanitizer stay off this job: ASan leak detection is unsupported
    # on Darwin (silently ignored) and TSan is covered on Linux already, so
    # only UBSan is worth the macOS runner cost here.
    timeout-minutes: 30

