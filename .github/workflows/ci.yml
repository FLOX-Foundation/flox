name: Build and Test

on:
  # main, plus audit-* integration branches (e.g. audit-2026-09): pushes
  # straight to one of these are PR merges into a branch nothing else opens
  # a PR against, so they never got a CI run of their own -- each merged PR
  # was only ever checked against the base it was tested on, never against
  # what the merge before it just changed. Two branches can each be green
  # in isolation and still break the integration branch when combined; nothing
  # ran to notice.
  #
  # audit/* and followup/* feature branches are deliberately left out: they
  # do have an open PR, so adding them here would run the whole matrix twice
  # (once for push, once for pull_request) -- 32 checks where 16 is the real
  # coverage. audit-* has no open PR against itself, so it doesn't double up.
  push:
    branches: [main, 'audit-*']
  pull_request:
  schedule:
    # Weekly affinity tests - Sunday at 3:00 UTC
    - cron: '0 3 * * 0'

# Fast-fail: a new push to the same branch / PR cancels the in-progress run.
# Build jobs (linux-*, macos, windows-*, sanitizers) depend on the quick
# format-check + verify-docs-current jobs, so a docs / format failure no
# longer leaves the multi-OS matrix burning cycles for ~10 minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    # Observed: ~15s.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - name: Install clang-format
      # Pinned to an exact version via the PyPI wheel instead of
      # `apt-get install clang-format` (whatever the distro currently
      # ships): the pin lives in scripts/clang-format-version.sh, the one
      # place scripts/check-format.sh and scripts/pre-commit also read it
      # from, so CI's baseline can't drift out from under either without
      # a deliberate change to that file.
      run: |
        . scripts/clang-format-version.sh
        python3 -m pip install --break-system-packages "clang-format==${CLANG_FORMAT_REQUIRED_VERSION}"

    - name: Check formatting
      run: ./scripts/check-format.sh

  verify-docs-current:
    runs-on: ubuntu-latest
    # Observed: ~3 min.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Verify indicator docs are in sync with registry.def
      run: |
        python3 scripts/gen_indicator_docs.py
        if ! git diff --exit-code -- docs/; then
          echo "::error::docs/ out of sync with include/flox/indicator/registry.def"
          echo "Run: python3 scripts/gen_indicator_docs.py"
          exit 1
        fi
    - name: Verify llms.txt and llms-full.txt are in sync with docs/
      run: python3 scripts/gen_llms_txt.py --check
    - name: Verify node/index.d.ts exports match the C++ binding
      run: python3 scripts/check_dts_exports.py
    - name: Verify node/index.d.ts class members cover every NAPI wrap method
      run: python3 scripts/check_dts_class_members.py
    - name: Verify cross-binding parity (pybind11/napi/codon/quickjs)
      # The step used to name three bindings and the script read three keys,
      # while the project has four: `quickjs` was in the manifest and in
      # nobody's code path, so a group with no QuickJS implementation passed.
      # It is read now. Most groups still carry no `quickjs` entry, and the
      # script prints that count rather than implying it checked them; turn on
      # --require-quickjs here once the manifest is complete.
      run: |
        pip install pyyaml
        python3 scripts/check_binding_parity.py
    - name: Verify error codes have docs and pages aren't stale
      run: python3 scripts/check_error_codes.py
    - name: Verify test gating against backtest / capi headers
      run: python3 scripts/check_test_gating.py

    - name: Verify every test file is reachable by the suite runners
      run: python3 scripts/check_suite_discovery.py

    # T050, T056 and T057 were the same defect three times: a Codon example
    # counted as coverage while CI never ran it. This is a static check (no
    # Codon compiler needed) so it belongs here rather than in the build
    # jobs -- every codon/examples/*.codon file must be named by the smoke
    # loop, the direct-run step, a known external gate, or a reasoned
    # entry in the script's own EXCEPTIONS list.
    - name: Verify every Codon example runs in CI or is a listed exception
      run: python3 scripts/check_codon_examples_coverage.py

    # Same defect, fourth time, this time on the QuickJS side:
    # merged_tape_smoke.js and run_trace_smoke.js shipped and were never
    # added to the "Verify QuickJS runner" step below, so nothing in CI
    # ever ran them. Also a static check -- every quickjs/examples/*.js
    # file must be named by that step or a reasoned entry in the script's
    # own EXCEPTIONS list.
    - name: Verify every QuickJS example runs in CI or is a listed exception
      run: python3 scripts/check_quickjs_examples_coverage.py

    # The QuickJS call sites are strings inside C++ string literals, so the
    # compiler cannot see a global that was never registered. setQueueFifoTopN
    # shipped that way and every call was a ReferenceError.
    - name: Verify every QuickJS global the JS layer calls is registered
      run: python3 scripts/check_quickjs_registration.py

    # JS_ToCString returns null for a Symbol or a throwing toString, and a
    # binding that skips the test hands that null to strlen. The test was
    # missing at most call sites until the owning holder replaced them.
    - name: Verify QuickJS string conversions go through the guarded holder
      run: python3 scripts/check_quickjs_tocstring.py
    - name: Verify Python API index is in sync with .pyi
      run: python3 scripts/gen_api_index.py --check
    - name: Verify doc snippets follow the --8<-- include pattern
      run: |
        # Ratchet floor: 24 `--8<--` includes today (4% of 481 typed
        # blocks). Migration target is 50% coverage. Bump the floor
        # in this step every time a PR successfully migrates more
        # snippets — never lower it.
        python3 scripts/check_doc_snippets.py --min-includes 24
    - name: Verify every API symbol named in hand-written docs exists
      run: python3 scripts/check_doc_symbols.py
    - name: Verify self-contained C++ Strategy examples in docs compile
      # check_doc_symbols.py only proves a named symbol still exists, not
      # that its signature still matches the doc's claim -- three
      # reference pages survived a real field/return-type change with
      # every doc gate green. This compiles every full Strategy example
      # against the real headers with -fsyntax-only, so a worked example
      # calling a method whose signature moved underneath it fails here
      # instead of shipping silently. Scope: full class-definition
      # examples only, not single-line signature/field fragments -- see
      # the script's own docstring for what remains unchecked.
      run: python3 scripts/check_doc_cpp_examples.py
    - name: Verify docs/examples/* still run (or at least parse)
      run: python3 scripts/check_doc_examples.py
    - name: Verify every doc page is reachable from the mkdocs nav
      run: python3 scripts/check_doc_nav.py
    - name: Verify relative doc links and anchors resolve
      run: python3 scripts/check_doc_links.py
    - name: Verify doc conventions (package names, build flags, no emoji)
      run: python3 scripts/check_doc_conventions.py
    - name: Verify flox-mcp bundled data is in sync
      run: |
        # IR snapshot is built from the IDL via libclang, plus the
        # binding manifest reads binding_parity.yaml — both deps need
        # to be present in this job for --check to run end-to-end.
        python3 -m pip install --break-system-packages libclang pyyaml
        python3 scripts/sync_mcp_data.py --check
    - name: Dependency ranges match between package and CI
      # flox-mcp shipped `mcp>=1.0` while this file installed `mcp>=1.0,<2`, so
      # CI was green on 1.x and users got the 2.0 SDK, which crashes on start.
      run: python3 scripts/check_dep_pins.py

    - name: Verify the sanitizer transcript scan is wired into every job that needs it
      # `ctest --output-on-failure` prints the output of the tests it decided
      # had failed, so a sanitizer report inside a test whose assertions
      # passed never reaches the log. Twice in the 2026-09 audit a real defect
      # was found that way. This keeps the scan wired in: a job that builds
      # with -fsanitize= has to run its tests and binaries through
      # scripts/run-with-sanitizer-scan.sh.
      run: |
        python3 scripts/scan_sanitizer_reports.py --self-test
        python3 scripts/check_sanitizer_scan.py

    - name: Build flox_py (needed by mcp/tests)
      # flox_mcp's bundled-data-reader and runtime-tool tests import
      # flox_py; without a build on PYTHONPATH, 19 mcp/tests cases skip and
      # the job's own "N passed, M skipped" summary reads identical to fully
      # healthy either way. The suite refuses to pass in that state now (see
      # mcp/tests/conftest.py), so a failure of this step surfaces there.
      # Mirrors linux-gcc's configure/build, minus the bindings this job
      # doesn't need.
      run: |
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build g++-14
        python3 -m pip install --break-system-packages "pybind11<3.1.0" numpy
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DFLOX_BUILD_PYTHON=ON \
              -DFLOX_ENABLE_BACKTEST=ON \
              -Dpybind11_DIR="$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')"
        cmake --build build -j$(nproc)

    - name: flox-mcp unit tests
      # `mcp` was never installed, so flox_mcp.server was unimportable and
      # nothing tested the 38 tool schemas or the dispatch chain that has to
      # match them. test_tool_dispatch.py needs it.
      #
      # FLOX_MCP_REQUIRE_DEPS makes a missing dependency fail the step instead
      # of shrinking the run: without the binding the suite drops 19 cases and
      # still reports a green summary, so the step above could stop producing
      # an importable module and nothing here would say so. mcp/tests/
      # conftest.py already infers this from CI=true; naming it here keeps the
      # requirement greppable from the workflow.
      env:
        FLOX_MCP_REQUIRE_DEPS: '1'
      run: |
        # Keep this range identical to mcp/pyproject.toml; check_dep_pins.py
        # enforces that.
        python3 -m pip install --break-system-packages pytest "mcp>=2.0,<3"
        PYTHONPATH=build/python python3 -m pytest mcp/tests/ -q

  linux-gcc:
    needs: [format-check, verify-docs-current]
    runs-on: ubuntu-24.04
    # Observed: ~15-20 min normally; this is the job that hung for hours on
    # PR #470 (T030 -- one step never released a threaded Runner's
    # ThreadSafeFunction, keeping the process alive with nothing left to do).
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build liblz4-dev g++-14 python3-dev python3-pip

    - name: Install Python packages
      # pybind11 pinned below 3.1.0: 3.1.0 changed the signatures stubgen
      # renders, so the committed .pyi (generated with 3.0.x) drifts against
      # an unpinned install. Bump this pin together with a stub regeneration.
      # scipy is the only workflow that installs it: LiveQueueCalibrator's
      # continuous-fit method is lazy-import-optional, and without scipy
      # here test_fit_scipy_matches_or_beats_grid_rmse always skips while
      # its mirror (missing-dependency error message) always passes, so the
      # suite summary reads clean either way.
      run: python3 -m pip install --break-system-packages "pybind11<3.1.0" numpy scipy pybind11-stubgen mypy pyright pytest

    - name: Install Codon
      env:
        CODON_VERSION: v0.19.6
      run: |
        mkdir -p ~/.codon && cd ~/.codon
        curl -fsSL "https://github.com/exaloop/codon/releases/download/${CODON_VERSION}/codon-linux-x86_64.tar.gz" \
          | tar zxf - --strip-components=1
        echo "$HOME/.codon/bin" >> $GITHUB_PATH

    - name: Build and Install GoogleTest
      run: |
        git clone --depth=1 https://github.com/google/googletest.git
        cmake -B gtest-build -S googletest -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_INSTALL_PREFIX=~/gtest-install
        cmake --build gtest-build
        cmake --install gtest-build

    - name: Build and Install Google Benchmark
      run: |
        git clone --depth=1 https://github.com/google/benchmark.git
        cmake -B benchmark-build -S benchmark -G Ninja \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON \
          -DCMAKE_INSTALL_PREFIX=~/benchmark-install
        cmake --build benchmark-build
        cmake --install benchmark-build

    - name: Configure
      run: |
        cmake -B build -G Ninja \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$HOME/gtest-install;$HOME/benchmark-install" \
              -Dpybind11_DIR="$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')" \
              -DFLOX_BUILD_TESTS=ON \
              -DFLOX_BUILD_BENCHMARKS=ON \
              -DFLOX_BUILD_DEMO=ON \
              -DFLOX_ENABLE_LZ4=ON \
              -DFLOX_ENABLE_BACKTEST=ON \
              -DFLOX_BUILD_CAPI=ON \
              -DFLOX_BUILD_PYTHON=ON \
              -DFLOX_BUILD_CODON=ON \
              -DFLOX_BUILD_QUICKJS=ON \
              -DFLOX_BUILD_TOOLS=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Build Node.js addon
      working-directory: node
      env:
        CXX: g++-14
        CC: gcc-14
      run: npm install && npm run build

    - name: Type-check node/index.d.ts
      working-directory: node
      run: npm run typecheck

    - name: Run tests
      run: scripts/run-with-sanitizer-scan.sh ctest --output-on-failure --test-dir build

    - name: Verify C API
      run: |
        test -f build/src/capi/libflox_capi.so
        nm -D build/src/capi/libflox_capi.so | grep -q flox_emit_market_buy
        nm -D build/src/capi/libflox_capi.so | grep -q flox_position_tracker_on_fill
        nm -D build/src/capi/libflox_capi.so | grep -q flox_order_tracker_on_submitted

    # The whole suite, not a hand-listed subset. This used to be ~35 named
    # steps, one per file, so any test file nobody remembered to add here
    # simply never ran -- 34 of 69 files at the time this changed, including
    # every regression gate added for the binding audit. scripts/
    # check_suite_discovery.py fails CI if a test file is not reachable.
    # check_binding_parity.py asserts a symbol exists; this calls it. Every
    # defect the binding audit found had an existing symbol, so the name gate
    # could not see any of them.
    - name: Binding smoke (call the surface, not just name it)
      run: PYTHONPATH=build/python python3 scripts/check_binding_smoke.py

    - name: Python test suite
      run: PYTHONPATH=build/python python3 -m pytest python/tests -q

    - name: Replay-equivalence CI gate
      run: python3 scripts/replay_equivalence_gate.py

    - name: Cross-binding .floxrun parity gate
      run: python3 scripts/floxrun_byte_identical_gate.py

    - name: Verify .pyi stubs are in sync with the binding
      run: python3 scripts/gen_pyi_stubs.py --check

    # Build the wheel from python/pyproject.toml, install it into a
    # throwaway venv, and assert every documented pure-Python module is
    # importable. Catches the regression where scikit-build-core only
    # collects the install component contents and silently drops new
    # `.py` files added under `python/flox_py/`.
    - name: Verify wheel ships every pure-Python module
      run: bash scripts/check_flox_py_wheel.sh

    - name: Type-check Python examples with mypy
      run: PYTHONPATH=build/python python3 -m mypy --ignore-missing-imports
        docs/examples/python_backtest_vs_live.py
        docs/examples/python_multi_symbol.py
        docs/examples/python_ccxt_live.py
        docs/examples/python_tape_roundtrip.py
        docs/examples/python_binance_archive.py
        docs/examples/python_binance_book_archive.py
        docs/examples/python_bybit_archive.py
        docs/examples/python_okx_archive.py
        docs/examples/python_bitget_archive.py
        docs/examples/python_deribit_archive.py
        docs/examples/python_orderbook_iterator.py
        docs/examples/python_rolling_top_k.py
        docs/examples/python_xs_panel.py
        docs/examples/python_rate_limit_aware_market_maker.py
        docs/examples/python_options_pricing.py
        docs/examples/python_options_greeks.py

    # Pyright is what Cursor / Pylance / VSCode actually run; mypy and
    # pyright sometimes disagree, and the AI-DX goal is the editor
    # experience. The CCXT example is excluded because ccxt itself ships
    # without typing for its primary surface and pyright (unlike mypy)
    # has no global "ignore missing imports" mode that's safe to use.
    - name: Type-check Python examples with pyright
      run: PYTHONPATH=build/python python3 -m pyright
        docs/examples/python_backtest_vs_live.py
        docs/examples/python_multi_symbol.py

    - name: Run Python example
      run: PYTHONPATH=build/python python3 docs/examples/python_backtest_vs_live.py

    - name: Run Python tape round-trip example
      run: PYTHONPATH=build/python python3 docs/examples/python_tape_roundtrip.py

    - name: Run Python options pricing example
      run: PYTHONPATH=build/python python3 docs/examples/python_options_pricing.py

    - name: Run Python options greeks example
      run: PYTHONPATH=build/python python3 docs/examples/python_options_greeks.py

    - name: Run Python Binance archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_binance_archive.py

    - name: Run Python Binance book archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_binance_book_archive.py

    - name: Run Python Bybit archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_bybit_archive.py

    - name: Run Python OKX archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_okx_archive.py

    - name: Run Python Bitget archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_bitget_archive.py

    - name: Run Python Deribit archive importer example
      run: PYTHONPATH=build/python python3 docs/examples/python_deribit_archive.py

    - name: Run Python OrderBookIterator example
      run: PYTHONPATH=build/python python3 docs/examples/python_orderbook_iterator.py

    - name: Run Python rolling top-K example
      run: PYTHONPATH=build/python python3 docs/examples/python_rolling_top_k.py

    - name: Run Python cross-sectional panel example
      run: PYTHONPATH=build/python python3 docs/examples/python_xs_panel.py

    - name: Run Python rate-limit-aware market maker example
      run: PYTHONPATH=build/python python3 docs/examples/python_rate_limit_aware_market_maker.py

    # The named steps above cover a hand-picked subset. This one executes
    # *every* docs/examples/*.py (minus the explicit skip-list in the
    # script), so a new example is covered the moment it lands. The docs-only
    # job runs the same gate without a build, where it degrades to a syntax
    # check; --require-runtime makes the missing extension a failure here.
    - name: Run every doc example against the built bindings
      run: PYTHONPATH=build/python python3 scripts/check_doc_examples.py --require-runtime

    - name: RL env→paper alpha-decay gate (synthetic)
      run: PYTHONPATH=build/python python3 scripts/rl_alpha_decay_gate.py --max-decay 0.30

    - name: Verify Codon binaries
      run: |
        test -f build/codon/codon_sma_crossover
        test -f build/codon/codon_pairs_strategy
        test -f build/codon/codon_backtest_from_csv
        test -f build/codon/codon_full_backtest
        test -f build/codon/codon_strategy_dispatch_smoke
        test -f build/codon/codon_backtest_vs_live
        file build/codon/codon_sma_crossover | grep -q ELF

    - name: Run Codon examples
      run: |
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_full_backtest
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_backtest_from_csv docs/examples/data/btcusdt_1m.csv
        LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
          ./build/codon/codon_backtest_vs_live

    # These print "ok"/"FAIL" per check and most do not raise or exit
    # nonzero on a failed one, so checking only the process exit code is
    # blind to a failing check -- codon_delta_book_smoke printed
    # "FAIL replayer delta: 2 2" and exited 0 under the old form of this
    # step for as long as the file existed. Capture each binary's output
    # and fail the step on either a nonzero exit or a FAIL line in it.
    - name: Run Codon smoke examples
      run: |
        set +e
        fail=0
        for bin in codon_latency_smoke codon_tape_diff_smoke \
                   codon_portfolio_risk_smoke codon_execution_algos_smoke \
                   codon_delta_book_smoke codon_order_book_window_smoke \
                   codon_composite_book_smoke codon_bar_close_ordering_parity_smoke \
                   codon_order_type_codes_smoke codon_indicator_bounds_smoke \
                   codon_signal_fields_smoke codon_aggregate_bars_smoke \
                   codon_strategy_dispatch_smoke codon_graph_smoke \
                   codon_streaming_graph_smoke codon_adf_smoke \
                   codon_autocorrelation_smoke codon_backtest_run_tapes_smoke \
                   codon_composite_dsl_smoke codon_feed_clock_smoke \
                   codon_merged_tape_smoke codon_multi_tf_helpers_smoke \
                   codon_order_group_smoke codon_run_trace_smoke \
                   codon_strategy_e2e_smoke codon_targets_smoke \
                   codon_trace_attach_smoke codon_sma_crossover \
                   codon_pairs_strategy; do
          echo "── $bin"
          out=$(LD_LIBRARY_PATH=build/src/capi:$HOME/.codon/lib/codon \
                "./build/codon/$bin" 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "!! $bin exited with code $rc"
            fail=1
          fi
          if echo "$out" | grep -qE '(^|[^A-Za-z])FAIL'; then
            echo "!! $bin printed a FAIL line above (its exit code alone did not catch this)"
            fail=1
          fi
        done
        exit $fail

    - name: Verify QuickJS runner
      run: |
        test -f build/src/quickjs/flox_js_runner
        ./build/src/quickjs/flox_js_runner quickjs/examples/sma_crossover.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/backtest_sma.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/latency_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/tape_diff_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/portfolio_risk_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/execution_algos_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/delta_book_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/order_book_window_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/order_group_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/bar_close_ordering_parity_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/renko_gap_bricks_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/pairs_strategy_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/merged_tape_smoke.js
        ./build/src/quickjs/flox_js_runner quickjs/examples/run_trace_smoke.js

    # Every test_*.js, not a hand-listed subset (9 of 21 files were unrun).
    # byte_identical_fixture.js is a fixture helper, not a test, and is
    # excluded by the test_ prefix.
    - name: Node.js test suite
      run: |
        cd node
        fail=0
        for f in test/test_*.js; do
          echo "── $f"
          node "$f" || fail=1
        done
        exit $fail

    - name: Verify Node.js TypeScript authoring layer
      run: |
        cd node
        npx tsc -p authoring/tsconfig.json
        npx tsc -p test/tsconfig.authoring.json
        node .test-build/test_authoring.js

    # `npm run typecheck` (above) only runs `tsc --noEmit` on test_types.ts,
    # which confirms every call matches index.d.ts but never executes the
    # calls -- a declared type that drifted from what the addon actually
    # accepts at runtime passes tsc and then throws (or silently returns
    # the wrong JS type) the first time real code runs. Compile it to JS
    # and run it against the built addon so that drift fails CI.
    - name: Run node/test/test_types.ts against the built addon
      run: |
        cd node
        npx tsc -p test/tsconfig.types.json
        node .test-build/test_types.js

    - name: Cross-binding parity (Python ↔ Node, same C++ math)
      run: PYTHONPATH=build/python python3 scripts/cross_binding_parity.py

    - name: Run Node.js example
      run: node docs/examples/node_backtest_vs_live.js

    # This one is about the process ending, not about its output: it sets no
    # exit code of its own and forces no exit, so a step that finishes at all
    # is the assertion. A threaded Runner that failed to hand the event loop
    # back would hang here instead, which is what the step is for.
    - name: Run Node.js threaded-runner lifetime example
      timeout-minutes: 2
      run: node docs/examples/node_threaded_runner_lifetime.js

    - name: Run demo
      run: scripts/run-with-sanitizer-scan.sh ./build/demo/flox_demo

    - name: Run benchmarks
      run: ./scripts/run-benchmarks.sh build/benchmarks

  linux-clang:
    needs: [format-check, verify-docs-current]
