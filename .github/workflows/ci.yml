  windows-msvc:
    needs: [format-check, verify-docs-current]
    runs-on: windows-latest
    # Observed: ~13 min. The step-level timeout-minutes below is separate --
    # that one bounds a single flaky-network step, not the whole job.
    timeout-minutes: 30

    env:
      # The VC++ telemetry uploader touches freshly linked binaries and
      # has been observed holding a .exe long enough for the next ninja
      # link step to fail with "being used by another process". Nothing
      # in CI needs it.
      VSCMD_SKIP_SENDTELEMETRY: 1
      VCPKG_DISABLE_METRICS: 1

    steps:
    - uses: actions/checkout@v5

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install ninja
      run: choco install ninja -y

    # Every one of these three steps reaches the network, and all three have
    # failed on us mid-run (vcpkg.exe download, portfile download). Retry with
    # backoff, and cap the step so a hung download fails in minutes instead of
    # sitting at the job's default limit.
    - name: Install vcpkg dependencies
      timeout-minutes: 25
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        function Invoke-WithRetry {
          param([string]$What, [int]$Attempts, [scriptblock]$Action)
          for ($i = 1; $i -le $Attempts; $i++) {
            & $Action
            if ($LASTEXITCODE -eq 0) { return }
            Write-Host "::warning::$What failed (attempt $i/$Attempts, exit $LASTEXITCODE)"
            if ($i -lt $Attempts) { Start-Sleep -Seconds (20 * $i) }
          }
          Write-Host "::error::$What failed after $Attempts attempts"
          exit 1
        }
        if (Test-Path vcpkg) { Remove-Item -Recurse -Force vcpkg }
        Invoke-WithRetry 'git clone vcpkg' 3 { git clone --depth 1 https://github.com/microsoft/vcpkg.git }
        Invoke-WithRetry 'bootstrap-vcpkg' 3 { .\vcpkg\bootstrap-vcpkg.bat }
        Invoke-WithRetry 'vcpkg install' 3 { .\vcpkg\vcpkg install lz4:x64-windows gtest:x64-windows benchmark:x64-windows }

    - name: Configure
      run: |
        cmake -B build -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
              -DFLOX_BUILD_TESTS=ON `
              -DFLOX_BUILD_BENCHMARKS=ON `
              -DFLOX_BUILD_DEMO=ON `
              -DFLOX_ENABLE_LZ4=ON `
              -DFLOX_ENABLE_BACKTEST=ON

    - name: Build
      # Retried once, Windows only. Parallel linking of ~150 test executables
      # intermittently loses one to "the process cannot access the file because
      # it is being used by another process" -- a file lock, not a build error.
      # ninja is incremental, so a real compile or link error re-fails in
      # seconds on the second attempt and still fails the job; only the lock
      # clears. This masks nothing deterministic.
      run: |
        cmake --build build -j $env:NUMBER_OF_PROCESSORS
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::build failed once; retrying in case a linker output was locked"
          cmake --build build -j $env:NUMBER_OF_PROCESSORS
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Run tests
      run: ctest --output-on-failure --test-dir build

    - name: Run demo
      run: .\build\demo\flox_demo.exe

