name: Build Python wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (prod)"
        type: boolean
        default: false

jobs:
  # Runs on both triggers this workflow has (workflow_dispatch and a `v*`
  # tag push), so a tag push cannot skip the actor restriction the way a
  # job-level `if: ... == 'workflow_dispatch'` used to let it. Downstream
  # jobs key off `needs.check-actor.result == 'success'` with no
  # `always()`/skipped fallback, so if a future trigger is ever added here
  # without updating this `if`, the build fails closed instead of the
  # actor check silently becoming a no-op again.
  check-actor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      # The release workflow pushes the tag as the app, not as a person, so
      # the app is allowed on the tag path only. Publishing is gated by the
      # `release` environment's required approval, not by this step.
      - name: Restrict who can reach the publish path
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RELEASE_APP: "flox-release-bot[bot]"
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$ACTOR" != "eeiaao" ]; then
              echo "::error::only eeiaao can start this workflow by hand (actor: $ACTOR)"
              exit 1
            fi
          else
            if [ "$ACTOR" != "eeiaao" ] && [ "$ACTOR" != "$RELEASE_APP" ]; then
              echo "::error::a v* tag reaches the publish path only from eeiaao or $RELEASE_APP (actor: $ACTOR)"
              exit 1
            fi
          fi
          echo "actor '$ACTOR' is allowed for event '$EVENT'"

  # A tag can be pushed from anywhere; publishing must only ever happen for
  # one that is actually reachable from main, so a stray branch or an
  # accidental `git push --tags` from a feature branch cannot reach the
  # registry just because it matches `v*`.
  check-tag-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag points at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.ref_name }} is not an ancestor of main -- refusing to publish from a tag that isn't on the main branch."
            exit 1
          fi

  # Publish must depend on the test suite actually having run against this
  # commit, not just on the wheel builds succeeding -- ci.yml's push trigger
  # is filtered to branches, so a tag push never runs it. This gives the tag
  # commit an independent, real pass/fail before anything is published.
  run-core-tests:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build liblz4-dev

      - name: Install GoogleTest
        run: |
          git clone --depth=1 https://github.com/google/googletest.git
          cmake -B gtest-build -S googletest -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/gtest-install"
          cmake --build gtest-build
          cmake --install gtest-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
                -DFLOX_BUILD_TESTS=ON \
                -DFLOX_ENABLE_BACKTEST=ON \
                -DFLOX_ENABLE_LZ4=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run the core test suite
        run: ctest --output-on-failure --test-dir build

  build-wheels:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    # cibuildwheel builds cp310-cp313 across three OSes; manylinux in
    # particular runs under emulation-adjacent container overhead.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse python/
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14.0"
          CIBW_BUILD_VERBOSITY: 1
          # cibuildwheel installs the just-built wheel into a clean venv
          # and runs this from a temp directory (not the checkout), so a
          # pass here proves the wheel that would be published actually
          # loads its compiled extension and can run a real call through
          # it -- not just that the build step exited zero. `numpy` is
          # already a runtime dependency in pyproject.toml and gets
          # pulled in by installing the wheel; nothing extra to declare
          # via CIBW_TEST_REQUIRES.
          CIBW_TEST_COMMAND: >
            python -c "import flox_py as flox; reg = flox.SymbolRegistry(); sid = reg.add_symbol('bybit', 'BTCUSDT', 0.01); assert flox.SLIPPAGE_NONE == 0; assert sid is not None; print('flox_py wheel smoke OK, symbol id:', sid)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # NOT part of the publish path (see publish-testpypi / publish-pypi
  # below) -- the sdist this produces cannot be installed. pyproject.toml
  # sets `cmake.source-dir = ".."` relative to python/, i.e. the repo
  # root one level above the sdist's own root; `python -m build --sdist`
  # packages only what is under python/, so the tarball never carries
  # include/ or src/ and a build backend invoked against it cannot find
  # the C++ sources it is told to configure. Publishing it would matter
  # only as a silent trap: pip falls back to the sdist on any platform
  # or interpreter a wheel wasn't built for (a linux aarch64 install, a
  # Python 3.14 the CIBW_BUILD matrix doesn't cover yet, ...) and then
  # fails deep inside a cmake configure step with no indication the
  # published sdist was the problem. Restructuring the package so the
  # sdist is self-contained is a separate task; until then this job
  # keeps building the artifact (for manual inspection) but it is never
  # uploaded to a registry.
  build-sdist:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build scikit-build-core pybind11
      - run: python -m build --sdist python/
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  # flox-mcp is a pure-Python wheel — one cross-platform build covers
  # every interpreter/OS combination. Versioned lockstep with flox-py
  # (set-version.sh keeps mcp/pyproject.toml in sync). The bundled
  # data (`mcp/flox_mcp/data/`) is regenerated by sync_mcp_data.py and
  # committed; the wheel just packages those bytes verbatim, so the
  # version users install matches the surface the data describes.
  build-mcp:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify bundled data is in sync
        run: |
          pip install pyyaml libclang
          python scripts/sync_mcp_data.py --check
      - run: pip install build
      - run: python -m build mcp/
      - uses: actions/upload-artifact@v4
        with:
          name: flox-mcp-dist
          path: mcp/dist/*

  publish-testpypi:
    needs: [build-wheels, build-mcp, run-core-tests, check-tag-on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Registry publishing runs only inside the gated environment: the
    # trusted-publisher OIDC subject is pinned to it, so a token cannot be
    # minted from anywhere else.
    environment: registry
    # Same ref/input condition as publish-pypi below: without it, any
    # workflow_dispatch build -- including one run with publish_pypi=false,
    # i.e. "just build" -- published to TestPyPI unconditionally and burned
    # the version there for good.
    if: |
      always() &&
      needs.build-wheels.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      needs.run-core-tests.result == 'success' &&
      (needs.check-tag-on-main.result == 'success' || needs.check-tag-on-main.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_pypi == 'true')
    permissions:
      id-token: write
    steps:
      # Two explicit downloads, not an unfiltered one: this job does not
      # depend on build-sdist, but that job still runs (see its comment)
      # and would otherwise get swept into dist/ by an unfiltered
      # download-artifact and published anyway.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: flox-mcp-dist
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build-wheels, build-mcp, run-core-tests, check-tag-on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Registry publishing runs only inside the gated environment: the
    # trusted-publisher OIDC subject is pinned to it, so a token cannot be
    # minted from anywhere else.
    environment: registry
    if: |
      always() &&
      needs.build-wheels.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      needs.run-core-tests.result == 'success' &&
      (needs.check-tag-on-main.result == 'success' || needs.check-tag-on-main.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_pypi == 'true')
    permissions:
      id-token: write
    steps:
      # See publish-testpypi above: two filtered downloads so build-sdist's
      # unpublishable artifact is never picked up.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: flox-mcp-dist
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
