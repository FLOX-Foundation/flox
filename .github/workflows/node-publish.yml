name: Publish flox-node

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish to npm"
        type: boolean
        default: false

jobs:
  # Runs on both triggers this workflow has (workflow_dispatch and a `v*`
  # tag push), so a tag push cannot skip the actor restriction the way a
  # job-level `if: ... == 'workflow_dispatch'` used to let it. Downstream
  # jobs key off `needs.check-actor.result == 'success'` with no
  # `always()`/skipped fallback, so if a future trigger is ever added here
  # without updating this `if`, the build fails closed instead of the
  # actor check silently becoming a no-op again.
  check-actor:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Restrict manual trigger
        if: github.actor != 'eeiaao'
        run: |
          echo "::error::Only eeiaao can trigger this workflow manually."
          exit 1

  # A tag can be pushed from anywhere; publishing must only ever happen for
  # one that is actually reachable from main, so a stray branch or an
  # accidental `git push --tags` from a feature branch cannot reach the
  # registry just because it matches `v*`.
  check-tag-on-main:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag points at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.ref_name }} is not an ancestor of main -- refusing to publish from a tag that isn't on the main branch."
            exit 1
          fi

  # Publish must depend on the test suite actually having run against this
  # commit, not just on the addon builds succeeding -- ci.yml's push trigger
  # is filtered to branches, so a tag push never runs it. This gives the tag
  # commit an independent, real pass/fail before anything is published.
  run-core-tests:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cmake ninja-build liblz4-dev

      - name: Install GoogleTest
        run: |
          git clone --depth=1 https://github.com/google/googletest.git
          cmake -B gtest-build -S googletest -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/gtest-install"
          cmake --build gtest-build
          cmake --install gtest-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$HOME/gtest-install" \
                -DFLOX_BUILD_TESTS=ON \
                -DFLOX_ENABLE_BACKTEST=ON \
                -DFLOX_ENABLE_LZ4=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run the core test suite
        run: ctest --output-on-failure --test-dir build

  build:
    needs: [check-actor]
    if: needs.check-actor.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: node
        run: npm install

      - name: Build flox + capi
        shell: bash
        run: |
          # FLOX_NATIVE=OFF is mandatory on distribution paths: it defaults
          # ON and adds -march=native, which is baked into the archive that
          # gets statically linked into the published .node and faults with
          # SIGILL on any consumer CPU missing an instruction the runner had.
          # python-wheels does this via pyproject.toml; this path did not.
          cmake -B build \
            -DFLOX_BUILD_CAPI=ON \
            -DFLOX_ENABLE_BACKTEST=ON \
            -DFLOX_NATIVE=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build node addon
        working-directory: node
        run: npm run build

      - name: Copy prebuilt
        shell: bash
        run: |
          mkdir -p node/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          cp node/build/Release/flox_node.node \
             node/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/flox_node.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.platform }}-${{ matrix.arch }}
          path: node/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/flox_node.node

  publish:
    needs: [build, run-core-tests, check-tag-on-main]
    runs-on: ubuntu-latest
    # Registry publishing runs only inside the gated environment: the
    # trusted-publisher OIDC subject is pinned to it, so a token cannot be
    # minted from anywhere else.
    environment: registry
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.run-core-tests.result == 'success' &&
      (needs.check-tag-on-main.result == 'success' || needs.check-tag-on-main.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_npm == 'true')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Upgrade npm for Trusted Publishing OIDC
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          path: node/prebuilds
          merge-multiple: true

      - name: Publish
        working-directory: node
        run: npm publish --access public --provenance
