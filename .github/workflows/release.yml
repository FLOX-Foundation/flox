name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.6)"
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    # The real gate. A required reviewer on this environment pauses every run
    # for manual approval in the UI -- a platform control that neither a
    # compromised token nor an edited workflow file can skip. The app key
    # lives in this environment's secrets, so no job outside the gate can
    # read it.
    environment: release
    permissions:
      contents: write
    steps:
      # Defense in depth only; the environment above is what actually gates.
      - name: Restrict manual trigger
        if: github.actor != 'eeiaao'
        run: |
          echo "::error::Only eeiaao can trigger this workflow."
          exit 1

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::version '${{ inputs.version }}' does not look like SemVer"
            exit 1
          fi

      # Short-lived installation token from the release app: minted per run,
      # dies in minutes, scoped to this repository. Replaces the fine-grained
      # PAT that expired twice and was readable by any workflow on any branch.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Bump version in source
        run: ./scripts/set-version.sh "${{ inputs.version }}"

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CMakeLists.txt python/pyproject.toml node/package.json mcp/pyproject.toml
          if git diff --cached --quiet; then
            echo "::warning::No version changes to commit (already at ${{ inputs.version }}?)"
          else
            git commit -m "release: v${{ inputs.version }}"
            git push origin main
          fi

          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ inputs.version }} already exists"
            exit 1
          fi
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
